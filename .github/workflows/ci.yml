name: DevOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t nethmi-student-app ./DevOps-CICD-Monitoring/Application

      - name: Run Application
        run: |
          docker run -d -p 8080:80 --name student-app nethmi-student-app

      - name: Test Application
        run: |
          curl --fail http://localhost:8080
